<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kabby 聊天室</title>
  <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    #topbar {
      background: #2d2d2d;
      border-bottom: 1px solid #333;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      flex: 0 0 auto;
    }
    #topbar .room-name { font-weight: 600; color: #f0f0f0; }
    #topbar .session-name { color: #888; font-size: 12px; }
    .perm-badge {
      border-radius: 10px;
      padding: 1px 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .perm-badge.rw { background: #2d5a4a; color: #8fdca0; }
    .perm-badge.ro { background: #5a4a1d; color: #ffd97a; }
    #topbar .spacer { flex: 1; }
    #topbar .me { color: #9cdcfe; font-size: 12px; }
    #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
    #conn-dot.on { background: #4caf50; }
    #conn-dot.off { background: #f44336; }

    /* Main: terminal + chat */
    #layout { flex: 1; display: flex; min-height: 0; }
    #term-side { flex: 1 1 auto; min-width: 0; position: relative; overflow: auto; background: #1e1e1e; padding: 4px; }
    #term-side .xterm { height: auto; }
    /* 「回到最新」浮鈕：訪客往上捲（本地）時出現 */
    #scroll-latest {
      position: absolute; right: 18px; bottom: 14px; z-index: 20;
      background: #0e639c; color: #fff; border: 0; border-radius: 14px;
      padding: 5px 14px; font-size: 12px; cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5); display: none;
    }
    #scroll-latest:hover { background: #1177bb; }
    #scroll-latest.visible { display: block; }
    /* 暫停跟隨中的狀態 */
    #pause-btn.paused { background: #5a4a1d; color: #ffd97a; }
    #frozen-hint {
      position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 20;
      background: rgba(90,74,29,0.95); color: #ffd97a; border-radius: 12px;
      padding: 3px 14px; font-size: 11px; display: none; pointer-events: none;
    }
    #frozen-hint.visible { display: block; }

    /* 乾淨版對話記錄 — 獨立大 modal（不在終端區內，捲動互不干擾） */
    #convo-panel {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
    }
    #convo-panel.visible { display: flex; }
    #convo-box {
      width: min(960px, 94vw); height: 88vh;
      background: #1e1e1e; border: 1px solid #444; border-radius: 8px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    #convo-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: #252526; border-bottom: 1px solid #333;
    }
    #convo-head .t { font-weight: 600; color: #f0f0f0; }
    #convo-head .sub { color: #777; font-size: 11px; }
    #convo-head .spacer { flex: 1; }
    #convo-body { flex: 1; overflow-y: auto; padding: 12px 18px; }
    .cv-turn { margin-bottom: 12px; max-width: 860px; }
    .cv-role {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      color: #888; margin-bottom: 3px; display: flex; gap: 8px; align-items: baseline;
    }
    .cv-turn.user .cv-role { color: #4ec9b0; }
    .cv-turn.assistant .cv-role { color: #9cdcfe; }
    .cv-role .cv-ts { color: #666; text-transform: none; letter-spacing: 0; }
    .cv-role .cv-model { color: #666; text-transform: none; letter-spacing: 0; }
    .cv-text {
      white-space: pre-wrap; word-break: break-word; line-height: 1.55;
      color: #d4d4d4; font-size: 13px;
      background: #232324; border: 1px solid #2c2c2c; border-radius: 6px;
      padding: 8px 12px;
    }
    .cv-turn.user .cv-text { background: #1d2b26; border-color: #2d4a3e; }
    /* Markdown 渲染版（助理訊息） */
    .cv-text.md { white-space: normal; }
    .cv-text.md p { margin: 0 0 8px; }
    .cv-text.md p:last-child { margin-bottom: 0; }
    .cv-text.md code {
      background: #1a1a1a; border: 1px solid #333; border-radius: 3px;
      padding: 0 5px; font-family: 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #dcdcaa;
    }
    .cv-text.md pre.md-code {
      background: #161616; border: 1px solid #333; border-radius: 5px;
      padding: 10px 12px; margin: 8px 0; overflow-x: auto;
      font-family: 'Cascadia Code', Consolas, monospace; font-size: 12px; line-height: 1.5;
      white-space: pre; color: #ce9178;
    }
    .cv-text.md .md-h { font-weight: 700; color: #f0f0f0; margin: 12px 0 6px; }
    .cv-text.md .md-h1 { font-size: 17px; } .cv-text.md .md-h2 { font-size: 15px; }
    .cv-text.md .md-h3 { font-size: 14px; } .cv-text.md .md-h4 { font-size: 13px; }
    .cv-text.md .md-list { margin: 6px 0 8px; padding-left: 22px; }
    .cv-text.md .md-list li { margin: 3px 0; }
    .cv-text.md .md-bq {
      border-left: 3px solid #4ec9b0; background: #212826;
      padding: 4px 10px; margin: 6px 0; color: #b8ccc6;
    }
    .cv-text.md hr.md-hr { border: 0; border-top: 1px solid #3a3a3a; margin: 10px 0; }
    .cv-text.md strong { color: #f0f0f0; }
    .cv-text.md a { color: #4ec9b0; }
    /* Markdown 表格 */
    .cv-text.md .md-table {
      border-collapse: collapse; margin: 8px 0; font-size: 12px;
      display: block; max-width: 100%; overflow-x: auto;
    }
    .cv-text.md .md-table th, .cv-text.md .md-table td {
      border: 1px solid #3a3a3a; padding: 5px 10px; text-align: left; vertical-align: top;
    }
    .cv-text.md .md-table th { background: #2a2a2a; color: #f0f0f0; font-weight: 600; }
    .cv-text.md .md-table tbody tr:nth-child(even) td { background: #232324; }
    /* 工具呼叫 chip */
    .cv-tools { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
    .cv-tool {
      font-size: 11px; background: #2a2620; border: 1px solid #4a3f2d; color: #d8c39a;
      border-radius: 4px; padding: 2px 8px; display: inline-flex; gap: 6px; align-items: baseline;
      max-width: 100%; overflow: hidden;
    }
    .cv-tool .cv-tool-hint { color: #8f8272; font-family: 'Cascadia Code', Consolas, monospace; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    /* 搜尋高亮 */
    mark.cv-hit { background: #6b5a1d; color: #ffe89a; border-radius: 2px; padding: 0 1px; }
    /* 標題列控制項 */
    #convo-search {
      background: #1a1a1a; border: 1px solid #3a3a3a; border-radius: 4px; color: #d4d4d4;
      font-size: 12px; padding: 4px 10px; width: 180px; outline: none;
    }
    #convo-search:focus { border-color: #4ec9b0; }
    #convo-tools-toggle.on { background: #4a3f2d !important; color: #ffd97a; }
    #convo-tools-toggle.disabled { opacity: .4; pointer-events: none; }
    #convo-reader-toggle.on { background: #2d3f4a !important; color: #9fd7ff; }
    .cv-empty { color: #777; text-align: center; padding: 40px 20px; line-height: 1.8; }
    #convo-btn.on { background: #2d5a4a; color: #cdebdf; }

    #chat-side {
      flex: 0 0 var(--chat-w, 300px);
      border-left: 1px solid #333;
      background: #252526;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      min-width: 0;
    }
    /* 聊天欄左緣拖曳把手 */
    #chat-resize {
      position: absolute; left: -3px; top: 0; bottom: 0; width: 6px;
      cursor: col-resize; z-index: 10;
    }
    #chat-resize:hover, #chat-resize.dragging { background: #4ec9b0; opacity: 0.6; }
    #chat-head {
      padding: 8px 12px;
      border-bottom: 1px solid #333;
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #guest-count { color: #4ec9b0; }
    #guest-list { padding: 4px 12px 8px; border-bottom: 1px solid #2a2a2a; display: flex; flex-wrap: wrap; gap: 6px; }
    .guest-chip { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 10px; padding: 1px 9px; font-size: 11px; color: #aaa; }
    .guest-chip.online { color: #cdebdf; border-color: #2d5a4a; }
    .guest-chip .dot { color: #4caf50; margin-right: 3px; }
    .guest-chip.offline .dot { color: #666; }

    #chat-msgs { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
    .msg { line-height: 1.45; word-break: break-word; }
    .msg .who { font-weight: 600; margin-right: 6px; }
    .msg.host .who { color: #4ec9b0; }
    .msg.guest .who { color: #9cdcfe; }
    .msg.me .who { color: #dcdcaa; }
    .msg .ts { color: #666; font-size: 10px; margin-left: 6px; }
    .msg.system { color: #888; font-size: 11px; font-style: italic; }
    /* 貼圖 */
    .msg .chat-img {
      display: block; max-width: 100%; max-height: 200px; border-radius: 4px;
      border: 1px solid #3a3a3a; margin-top: 4px; cursor: zoom-in;
    }
    .msg .img-expired { color: #666; font-style: italic; font-size: 11px; }
    /* @mention */
    .msg .mention { color: #4ec9b0; font-weight: 600; }
    .msg .mention.me { background: #4a3d13; color: #ffd97a; border-radius: 3px; padding: 0 3px; }
    .msg.mentioned { background: #2e2a1a; border-left: 2px solid #d7ba7d; padding-left: 6px; border-radius: 2px; }
    .mention-pop {
      position: absolute; bottom: 100%; left: 8px; right: 8px; margin-bottom: 4px;
      background: #2d2d2d; border: 1px solid #444; border-radius: 4px;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.4); z-index: 50;
      max-height: 150px; overflow-y: auto; display: none;
    }
    .mention-pop.visible { display: block; }
    .mention-pop .mi { padding: 5px 10px; cursor: pointer; font-size: 12px; color: #ccc; }
    .mention-pop .mi:hover, .mention-pop .mi.active { background: #094771; color: #fff; }
    /* 圖片 lightbox */
    #img-lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 400;
      display: none; align-items: center; justify-content: center; cursor: zoom-out;
    }
    #img-lightbox.visible { display: flex; }
    #img-lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 4px; }

    #chat-input-row { flex: 0 0 auto; display: flex; gap: 6px; padding: 8px; border-top: 1px solid #333; position: relative; }
    #chat-input {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 6px 8px;
      font-size: 13px;
    }
    .btn {
      background: #0e639c; color: #fff; border: 0; border-radius: 3px;
      padding: 6px 14px; font-size: 13px; cursor: pointer;
    }
    .btn:hover { background: #1177bb; }
    .btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

    /* Join / closed overlay */
    #overlay {
      position: fixed; inset: 0; background: #1e1e1e; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #overlay.hidden { display: none; }
    .join-box {
      background: #2d2d2d; border: 1px solid #444; border-radius: 6px;
      padding: 24px 26px; width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .join-box h2 { font-size: 16px; margin-bottom: 4px; }
    .join-box .sub { color: #888; font-size: 12px; margin-bottom: 14px; }
    .join-box label { display: block; margin: 10px 0 4px; font-size: 12px; color: #aaa; }
    .join-box input {
      width: 100%; background: #1e1e1e; color: #d4d4d4;
      border: 1px solid #444; border-radius: 3px; padding: 7px 9px; font-size: 13px;
    }
    .join-box .error { color: #f48771; font-size: 12px; margin-top: 10px; min-height: 15px; }
    .join-box .actions { margin-top: 14px; display: flex; justify-content: flex-end; }
    .join-box .closed-note { color: #ffd97a; font-size: 13px; line-height: 1.6; }

    /* toast */
    #toast-host { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
    .toast {
      background: #2d2d2d; border: 1px solid #444; border-left: 3px solid #888;
      border-radius: 4px; padding: 10px 14px; font-size: 12px; color: #ddd;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5); max-width: 420px;
      opacity: 1; transition: opacity 0.3s;
    }
    .toast.warn { border-left-color: #d7913a; color: #ffd9a8; background: #2e2620; }
    .toast.out { opacity: 0; }

    /* 窄螢幕：聊天欄疊到下方 */
    @media (max-width: 720px) {
      #layout { flex-direction: column; }
      #chat-side { flex: 0 0 40%; border-left: 0; border-top: 1px solid #333; }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="conn-dot"></span>
    <span class="room-name" id="room-name">—</span>
    <span class="session-name" id="session-name"></span>
    <span class="perm-badge ro" id="role-badge" style="background:#333;color:#bbb">訪客</span>
    <span class="perm-badge ro" id="perm-badge">唯讀</span>
    <span class="spacer"></span>
    <span class="me" id="me-nick"></span>
    <button class="btn" id="master-freeze-btn" style="background:#3c3c3c; display:none" title="凍結／解除全房輸入（協作者暫為唯讀；房主不受影響）">🧊 凍結</button>
    <button class="btn" id="master-close-btn" style="background:#5a2d2d; display:none" title="關閉整個聊天室（所有人被斷開；session 不受影響）">關房</button>
    <button class="btn" id="convo-btn" style="background:#3c3c3c" title="乾淨排版的完整對話記錄（讀對話存檔，不受終端重繪影響，獨立捲動）">📜 對話記錄</button>
    <button class="btn" id="pause-btn" style="background:#3c3c3c" title="切到自己畫面：定格終端慢慢看，不被房主的輸出/捲動打擾；聊天不受影響">⏸ 看自己畫面</button>
    <button class="btn" id="leave-btn" style="background:#3c3c3c" title="離開聊天室（清掉本機入場券）">離開</button>
  </div>

  <div id="layout">
    <div id="term-side">
      <div id="frozen-hint">⏸ 自己畫面 — 已定格，房主那邊的新輸出暫存中</div>
      <button id="scroll-latest">↓ 回房主畫面</button>
    </div>
    <aside id="chat-side">
      <div id="chat-resize" title="拖曳調整聊天欄寬度"></div>
      <div id="chat-head"><span>聊天</span><span id="guest-count"></span></div>
      <div id="guest-list"></div>
      <div id="chat-msgs"></div>
      <div id="chat-input-row">
        <div class="mention-pop" id="mention-pop"></div>
        <button class="btn" id="chat-img" style="background:#3c3c3c; padding:6px 10px" title="貼圖（也可直接在輸入框 Ctrl+V 貼上截圖）">🖼</button>
        <input id="chat-input" type="text" placeholder="訊息… @ 可 tag 人" maxlength="2000" autocomplete="off" />
        <button class="btn" id="chat-send">送出</button>
        <input type="file" id="chat-file" accept="image/*" style="display:none" />
      </div>
    </aside>
  </div>

  <!-- 乾淨版對話記錄（獨立大 modal） -->
  <div id="convo-panel">
    <div id="convo-box">
      <div id="convo-head">
        <span class="t">📜 對話記錄</span>
        <span class="sub" id="convo-status"></span>
        <span class="spacer"></span>
        <input id="convo-search" type="search" placeholder="🔍 搜尋…" autocomplete="off" />
        <button class="btn" id="convo-reader-toggle" style="background:#3c3c3c; padding:4px 12px" title="簡潔模式：只顯示結論，隱藏過場與工具細節（適合非技術讀者）">📖 簡潔</button>
        <button class="btn" id="convo-tools-toggle" style="background:#3c3c3c; padding:4px 12px" title="顯示 / 隱藏工具呼叫（Edit / Bash / Read…）">🔧 工具</button>
        <button class="btn" id="convo-export-md" style="background:#3c3c3c; padding:4px 12px" title="下載為 Markdown">⬇ MD</button>
        <button class="btn" id="convo-export-html" style="background:#3c3c3c; padding:4px 12px" title="下載為 HTML">⬇ HTML</button>
        <button class="btn" id="convo-refresh" style="background:#3c3c3c; padding:4px 12px">刷新</button>
        <button class="btn" id="convo-close" style="background:#3c3c3c; padding:4px 12px">× 關閉</button>
      </div>
      <div id="convo-body"></div>
    </div>
  </div>

  <!-- 聊天貼圖放大檢視 -->
  <div id="img-lightbox"><img alt="" /></div>

  <!-- 入房表單 / 房間關閉提示 -->
  <div id="overlay">
    <div class="join-box" id="join-box">
      <h2>進入 kabby 聊天室</h2>
      <div class="sub">輸入房主給你的密碼與你的暱稱（密碼決定你的角色：房主／協作／訪客）</div>
      <label for="join-key">密碼</label>
      <input id="join-key" type="text" autocomplete="off" spellcheck="false" />
      <label for="join-nick">暱稱</label>
      <input id="join-nick" type="text" maxlength="24" autocomplete="off" />
      <div class="error" id="join-error"></div>
      <div class="actions"><button class="btn" id="join-submit">進入</button></div>
    </div>
  </div>

  <div id="toast-host"></div>

  <script src="https://unpkg.com/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="/convo-view.js"></script>
  <script src="/room.js"></script>
</body>
</html>

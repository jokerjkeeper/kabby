<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kabby 檔案傳輸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }
    #topbar {
      background: #2d2d2d;
      border-bottom: 1px solid #333;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      flex: 0 0 auto;
    }
    #topbar .title { font-weight: 600; color: #f0f0f0; }
    #topbar .meta { color: #888; font-size: 12px; }
    #topbar .spacer { flex: 1; }
    #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
    #conn-dot.on { background: #4caf50; }
    #conn-dot.off { background: #f44336; }

    main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: #4a4a4a transparent; }
    section { background: #252526; border: 1px solid #333; border-radius: 6px; padding: 10px 12px; }
    section h2 { font-size: 13px; font-weight: 600; color: #f0f0f0; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
    section h2 small { color: #888; font-weight: 400; font-size: 11px; }
    .empty { color: #777; font-style: italic; }
    #notice { display: none; background: #5a4a1d; color: #ffd97a; padding: 8px 12px; border-radius: 4px; }
    #notice.show { display: block; }

    /* 統計卡 */
    #stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .stat { background: #1e1e1e; border: 1px solid #333; border-radius: 4px; padding: 6px 10px; }
    .stat .k { color: #888; font-size: 11px; }
    .stat .v { color: #f0f0f0; font-size: 16px; font-weight: 600; margin-top: 2px; word-break: break-all; }
    .stat .v.small { font-size: 12px; font-weight: 400; }

    /* 進行中 */
    .item { padding: 6px 0; border-bottom: 1px solid #2e2e2e; }
    .item:last-child { border-bottom: none; }
    .item .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .item .path { color: #9cdcfe; font-family: Consolas, monospace; word-break: break-all; flex: 1; min-width: 200px; }
    .item .info { color: #aaa; font-size: 12px; white-space: nowrap; }
    .bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .bar > div { height: 100%; background: #0e639c; transition: width 0.4s; }
    .bar.hash > div { background: #8a6d1d; }

    /* 最近事件 */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #2e2e2e; vertical-align: top; }
    th { color: #888; font-weight: 400; position: sticky; top: 0; background: #252526; }
    td.path { font-family: Consolas, monospace; word-break: break-all; color: #cfcfcf; }
    td.num { text-align: right; white-space: nowrap; }
    tr.denied td { color: #f48771; }
    tr.denied td.path { color: #f48771; }
    tr.error td { color: #d7ba7d; }
    tr.aborted td { color: #9a9a9a; }
    #recent-wrap { max-height: 50vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #4a4a4a transparent; }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="conn-dot"></span>
    <span class="title">📦 檔案傳輸</span>
    <span class="meta" id="cfg-meta"></span>
    <span class="spacer"></span>
    <span class="meta" id="updated"></span>
  </div>
  <main>
    <div id="notice"></div>
    <section>
      <h2>統計 <small id="since"></small></h2>
      <div id="stats"></div>
    </section>
    <section>
      <h2>進行中的下載 <small id="active-count"></small></h2>
      <div id="active"></div>
    </section>
    <section>
      <h2>正在計算 SHA256 <small id="hash-count"></small></h2>
      <div id="hashing"></div>
    </section>
    <section>
      <h2>最近事件 <small>最新 200 筆，被拒的標紅</small></h2>
      <div id="recent-wrap">
        <table>
          <thead><tr><th>時間</th><th>來源 IP</th><th>端點</th><th>路徑</th><th>Range</th><th>狀態</th><th>傳出</th><th>耗時</th><th>結果</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="files.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/theme.css" />
  <script src="/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kabby 檔案傳輸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg-3);
      color: var(--fg-5);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }
    #topbar {
      background: var(--bg-9);
      border-bottom: 1px solid var(--line-5);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      flex: 0 0 auto;
    }
    #topbar .title { font-weight: 600; color: var(--fg-2); }
    #topbar .meta { color: var(--fg-12); font-size: 12px; }
    #topbar .spacer { flex: 1; }
    #topbar .theme-btn {
      background: var(--bg-11); color: var(--fg-7); border: 0; border-radius: 4px;
      padding: 3px 8px; cursor: pointer; font-size: 12px;
    }
    #topbar .theme-btn:hover { background: var(--bg-13); }
    #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-17); }
    #conn-dot.on { background: var(--bg-green-3); }
    #conn-dot.off { background: var(--bg-red-6); }

    main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: var(--line-8) transparent; }
    section { background: var(--bg-6); border: 1px solid var(--line-5); border-radius: 6px; padding: 10px 12px; }
    section h2 { font-size: 13px; font-weight: 600; color: var(--fg-2); margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
    section h2 small { color: var(--fg-12); font-weight: 400; font-size: 11px; }
    .empty { color: var(--fg-13); font-style: italic; }
    #notice { display: none; background: var(--bg-yellow-4); color: var(--fg-yellow-2); padding: 8px 12px; border-radius: 4px; }
    #notice.show { display: block; }

    /* 統計卡 */
    #stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .stat { background: var(--bg-3); border: 1px solid var(--line-5); border-radius: 4px; padding: 6px 10px; }
    .stat .k { color: var(--fg-12); font-size: 11px; }
    .stat .v { color: var(--fg-2); font-size: 16px; font-weight: 600; margin-top: 2px; word-break: break-all; }
    .stat .v.small { font-size: 12px; font-weight: 400; }

    /* 進行中 */
    .item { padding: 6px 0; border-bottom: 1px solid var(--line-4); }
    .item:last-child { border-bottom: none; }
    .item .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .item .path { color: var(--fg-blue); font-family: Consolas, monospace; word-break: break-all; flex: 1; min-width: 200px; }
    .item .info { color: var(--fg-9); font-size: 12px; white-space: nowrap; }
    .bar { height: 6px; background: var(--bg-10); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .bar > div { height: 100%; background: var(--bg-blue-4); transition: width 0.4s; }
    .bar.hash > div { background: var(--bg-yellow-6); }

    /* 最近事件 */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line-4); vertical-align: top; }
    th { color: var(--fg-12); font-weight: 400; position: sticky; top: 0; background: var(--bg-6); }
    td.path { font-family: Consolas, monospace; word-break: break-all; color: var(--fg-6); }
    td.num { text-align: right; white-space: nowrap; }
    tr.denied td { color: var(--fg-red-3); }
    tr.denied td.path { color: var(--fg-red-3); }
    tr.error td { color: var(--fg-yellow); }
    tr.aborted td { color: var(--fg-10); }
    #recent-wrap { max-height: 50vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-8) transparent; }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="conn-dot"></span>
    <span class="title">📦 檔案傳輸</span>
    <span class="meta" id="cfg-meta"></span>
    <span class="spacer"></span>
    <span class="meta" id="updated"></span>
    <button id="theme-btn" class="theme-btn">☀</button>
  </div>
  <main>
    <div id="notice"></div>
    <section>
      <h2>統計 <small id="since"></small></h2>
      <div id="stats"></div>
    </section>
    <section>
      <h2>進行中的下載 <small id="active-count"></small></h2>
      <div id="active"></div>
    </section>
    <section>
      <h2>正在計算 SHA256 <small id="hash-count"></small></h2>
      <div id="hashing"></div>
    </section>
    <section>
      <h2>最近事件 <small>最新 200 筆，被拒的標紅</small></h2>
      <div id="recent-wrap">
        <table>
          <thead><tr><th>時間</th><th>來源 IP</th><th>端點</th><th>路徑</th><th>Range</th><th>狀態</th><th>傳出</th><th>耗時</th><th>結果</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="files.js"></script>
</body>
</html>
